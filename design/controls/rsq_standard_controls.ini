# RSQ UBQ Series: RSQoopaControls, the series' controls (design/controls/rsq_standard_controls.ini). THE ONE SOURCE.
# The name is the owner's (11:23: "call this RSQoopaControls"); the file keeps its path.
#
# The OWNER'S OWN CONTROLLER LAYOUT (given 2026-11-27, his words in design/controls/CONTROLS.md; one correction from
# him: one modifier, two triggers, each trigger its own hand, 10:17/10:32; his revised list at 10:31, built at 10:34), written in QuestZDoom 17.3's key names. Every command is
# one that exists: the engine's, Brutal Doom's, BD22 VR Reloaded's or a series KEYCONF alias (CONTROLS.md cites each).
#
# How it ships: in RSQ_Controls.pk3 (Controls/; tools/howtoplay/howto_template.zs, its lists GENERATED from this file by
# tools/howtoplay/gen_howtoplay.py): a yes / no screen the first time the pk3 loads (again only when these lines change),
# and Options > Radiant Silvergun Options > Use RSQoopaControls any time. Yes writes every line below: [Doom.Bindings]
# into the engine's binds, [Doom.DoubleBindings] into its double-press binds, [CVars] into the named settings. A line
# with nothing after "=" empties that button (the owner: "(empty)"). No other key is touched (keyboard keys included).
# The same generator writes Controls/RSQoopaControls.cfg (shipped beside the pk3), these lines as console commands
# (bind / unbind, doublebind / undoublebind, set): "exec RSQoopaControls.cfg" in the console. How To Play's CONTROLS
# tab draws these lines too.
# The front README's RSQoopaControls pictures (design/readme_art/make_controls_table.py, make_controls_quest2.py) and
# its Keys table are drawn from this file and CONTROLS.md, and refuse to draw a command they have no words for.
#
# DO NOT paste these sections into your gzdoom ini by hand: when the engine finds a [Doom.Bindings] section it unbinds
# every key first and then reads only what is there (gzdoom qzd17.3 src/gameconfigfile.cpp:821-830), so every other
# bind would be lost.
#
# HOW QUESTZDOOM 17.3 MAKES THESE KEYS (emawind84/questzdoom a85c819, Projects/Android/jni/QzDoom/VrInputDefault.cpp;
# right-handed: left = off hand, right = main hand; left-handed swaps the hands, the names stay with the hand's role):
# - THE MODIFIER is the right (main) grip while vr_secondary_button_mappings is on (its default, gzdoom
#   hw_vrmodes.cpp:118; VrInputDefault.cpp:51-55). Held, it sends no key of its own and every other button sends a
#   second key name (VrInputDefault.cpp:375-407 right hand, 448-484 left hand, 526-564 the sticks). The left grip has
#   no modifier key while vr_two_handed_weapons is on (its default; VrInputDefault.cpp:480-483).
# - A DOUBLE PRESS is the engine's doublebind: a second press of the same key within 571 ms runs the
#   [Doom.DoubleBindings] line instead of the normal one (gzdoom src/common/console/c_bind.cpp:863-889). The FIRST
#   press still runs the normal bind: a double press always does the single press's command once first.
# Key names are the engine's (c_bind.cpp:58-157). Lines are Key=command.

[Doom.Bindings]

# ---------------------------------------------------------------- LEFT (OFF HAND)

# left trigger: offhand fire. (VrInputDefault.cpp:413-416 Shift; the engine's own default, defbind1.txt:9)
Shift=+oh_attack
# modifier + left trigger: offhand alt fire (owner, 10:17/10:32: one modifier, two triggers; each trigger is its own hand).
# (VrInputDefault.cpp:451-454 Alt; the engine's own default, defbind1.txt:8)
Alt=+oh_altatk
# left grip: (empty). It still steadies a gun with both hands (engine code, VrInputDefault.cpp:131-142) and the mods
# still read it as the off grip (raw key 443). (VrInputDefault.cpp:442-445 RThumb; the engine had +speed here)
RThumb=
# left stick: up down, strafe left right. QuestZDoom moves you with the stick itself (VrInputDefault.cpp:239-260); these
# four are its own binds for the stick's keys, kept (VrInputDefault.cpp:486-514; commonbinds.txt:34-37).
Axis1Plus=+moveright
Axis1Minus=+moveleft
Axis2Plus=+forward
Axis2Minus=+back
# left stick click in: Slowmo (RSQ SlowMo's slow motion on / off). (VrInputDefault.cpp:431-434 Space; was +use)
Space=rsqsm_toggle
# MODIFIER + left stick click in: Crisis Dive (RSQ SlowMo). (VrInputDefault.cpp:469-472 Home; was land)
Home=rsqsm_dodge
# pad x: ShieldSaw toggle (RSQ ShieldSaw's one key; owner 10:31). (VrInputDefault.cpp:419-422 Pad_X; was invuse)
Pad_X=ssq_draw
# pad y: next item (owner 11:06). (VrInputDefault.cpp:425-428 Pad_Y; was togglemap)
Pad_Y=invnext
# MODIFIER + pad x: GBOVR menu toggle: Gun Bonsai's Display Info screen, by the network event its own key sends
# (shown working on the rig: design/rigtest_2026-11-10/RESULTS_GBOVR.md:12; owner 11:09). (VrInputDefault.cpp:457-460 PgDn; was invprev)
PgDn=netevent bonsai-show-info
# MODIFIER + pad y: use item (the engine's use-item command, the selected item; owner 11:06). Gun Bonsai's menu key
# (netevent bonsai-show-info) was here until 11:06. (VrInputDefault.cpp:463-466 PgUp; was invnext)
PgUp=invuse

# ---------------------------------------------------------------- RIGHT (MAIN HAND)

# right trigger: mainhand fire. (VrInputDefault.cpp:338-341 RTrigger; the engine's own default, commonbinds.txt:22)
RTrigger=+attack
# modifier + right trigger: mainhand alt fire (owner, 10:08). (VrInputDefault.cpp:378-381 LTrigger, key 446; the
# engine's own default, commonbinds.txt:23)
LTrigger=+altattack
# right stick up: jump. (VrInputDefault.cpp:317-320 MWheelUp; was weapprev)
MWheelUp=+jump
# MODIFIER + right stick up: quick grenade, Brutal Doom's or RSQ Grenade's: one button serves both (RSQ Grenade's Quick
# Grenade reads this button, Grenade/zscript/rsqgn/hand.zs:750). (VrInputDefault.cpp:561-564 Axis8Plus; was weapprev 1)
Axis8Plus=+user1
# right stick down: KICK (Brutal Doom's kick is its zoom key: BD KEYCONF.txt:23, src/Inputs.acs:333-339; BD22's DoKick is
# the Zoom label, actors/Weapons/DEFAULTWEAPON.dec:390-391). Owner 11:10: "stick down 1x is kick, we have natural crouch
# in QZD". Crouching is done by crouching for real: see [CVars] vr_crouch_use_button. (VrInputDefault.cpp:311-314 MWheelDown)
MWheelDown=+zoom
# MODIFIER + right stick down: reload both guns / drop the mag with one gun (BD22 VR Reloaded: each hand that holds a
# gun reloads, zscript/rsq/flick.zs:53; one gun's hand reload starts by dropping the magazine, zscript/rsr/vreload.zs:3-9).
# (VrInputDefault.cpp:556-559 Axis8Minus; was weapnext 1)
Axis8Minus=+reload
# right stick left / right, no modifier: SNAP TURN. QuestZDoom does it from the stick itself; not bound here (owner 10:28).
# MODIFIER + R stick left: mainhand prev weapon. (VrInputDefault.cpp:541-544 Axis7Minus; was switchhand 1)
Axis7Minus=weapprev
# MODIFIER + R stick right: mainhand next weapon. (VrInputDefault.cpp:536-539 Axis7Plus; was switchhand 0)
Axis7Plus=weapnext
# pad a: use. (VrInputDefault.cpp:344-347 Pad_A; the engine's own default, commonbinds.txt:18)
Pad_A=+use
# MODIFIER + pad a: BD Dual (Brutal Doom's Dual Wield). (VrInputDefault.cpp:384-387 LThumb; was crouch)
LThumb=+user3
# pad b: Recenter Torso (RSQ Tactical Rig, TacticalRig/KEYCONF.txt:3-5; owner 10:49, not on left grip so holster grabs
# don't recenter). (VrInputDefault.cpp:350-353 Pad_B; was +jump)
Pad_B=rsqtr_recenter
# modifier + pad b: Main Menu. (VrInputDefault.cpp:390-393 Backspace; the engine's own default, commonbinds.txt:15)
Backspace=menu_main
# right stick click in: fire grapple (RSQ Grapple's Fire Hook). (VrInputDefault.cpp:356-359 Enter; was invuse)
Enter=+rsqgr_hook
# MODIFIER + right stick click in: Open Wheel (RSQ Wheel). (VrInputDefault.cpp:396-399 Tab; was togglemap)
Tab=+wr_wheel

[Doom.DoubleBindings]

# left stick click 2x and right stick click 2x: Brutal Doom's Offend taunt (brutaltaunt: BD KEYCONF.txt:57-59, "pukename
# BDweaponActions always 1"; BD22 Taunt state actors/Weapons/DEFAULTWEAPON.dec:601-610: the middle-finger sprite, a voice
# taunt, A_AlertMonsters). Owner 11:15-11:17: taunt during SlowMo or on the way in on the grapple. The second press runs
# this INSTEAD of the single bind (c_bind.cpp C_DoKey), so SlowMo stays on and the hook is already out.
Space=brutaltaunt
Enter=brutaltaunt

# left grip 2x: (empty). The map is on pad y 2x only (owner 11:08).
RThumb=
# pad y 2x: map (owner 11:06). The first press still runs pad y's next item.
Pad_Y=togglemap
# pad a 2x: slot 3. The first press still runs pad a's Use.
Pad_A=slot 3
# pad b 2x: RSQ Glow In The Dark's Randomize Look (GlowInTheDark/MENUDEF.txt:126; owner 11:06). The first press still
# runs Recenter Torso.
Pad_B=netevent rsqgd_randomize

[CVars]

# NATURAL CROUCH ON (owner 11:10: "we have natural crouch in QZD jsut make sur eit is on"). Off = the view height follows
# the headset and the player crouches by crouching (gzdoom qzd17.3 hw_vrmodes.cpp:122, default true = crouch by button;
# hw_openxrdevice.cpp:160-171, :574-583; QuestZDoom VrCommon.h:18).
vr_crouch_use_button=false
