// Not run in an engine yet.
// [Doom.Bindings]
bind Shift "+oh_attack"
bind Alt "+oh_altatk"
unbind RThumb
bind Axis1Plus "+moveright"
bind Axis1Minus "+moveleft"
bind Axis2Plus "+forward"
bind Axis2Minus "+back"
bind Space "rsqsm_toggle"
bind Home "rsqsm_dodge"
bind Pad_X "ssq_draw"
bind Pad_Y "invnext"
bind PgDn "netevent bonsai-show-info"
bind PgUp "invuse"
bind RTrigger "+attack"
bind LTrigger "+altattack"
bind MWheelUp "+jump"
bind Axis8Plus "+user1"
bind MWheelDown "+zoom"
bind Axis8Minus "+reload"
bind Axis7Minus "weapprev"
bind Axis7Plus "weapnext"
bind Pad_A "+use"
bind LThumb "+user3"
bind Pad_B "rsqtr_recenter"
bind Backspace "menu_main"
bind Enter "+rsqgr_hook"
bind Tab "+wr_wheel"
// [Doom.DoubleBindings]
doublebind Space "brutaltaunt"
doublebind Enter "brutaltaunt"
undoublebind RThumb
doublebind Pad_Y "togglemap"
doublebind Pad_A "slot 3"
doublebind Pad_B "netevent rsqgd_randomize"
// [CVars]
set vr_crouch_use_button false
